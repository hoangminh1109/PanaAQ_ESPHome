substitutions:
  ap_prefix: !secret wifi_ap_ssid_prefix
  device_name: "sunshine-airpurifier"
  device_friendlyname: "Sunshine Air Purifier"

esphome:
  name: "${device_name}"
  friendly_name: "${device_friendlyname}"
  min_version: 2024.11.0
  name_add_mac_suffix: false

external_components:
  - source: components

esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${ap_prefix}.${device_name}"
    password: !secret wifi_ap_password

captive_portal:

i2c:
  sda: GPIO04
  scl: GPIO05
  scan: true
  id: bus_a
  frequency: 800kHz

fan:
  - platform: panaaq
    id: my_fan
    name: "Air Purifier"
    address: 0x20
    i2c_id: bus_a
